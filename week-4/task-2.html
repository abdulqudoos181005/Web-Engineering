<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Grey-box homepage clone</title>
  <link rel="stylesheet" href="task-2.css">
</head>
<body>
  <!-- Structure reference: https://www.airbnb.com/ -->
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-placeholder" aria-label="Brand placeholder"></div>
      <div class="search-placeholder" aria-label="Search placeholder">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <nav class="header-actions" aria-label="Header navigation">
        <div class="nav-placeholder"></div>
        <div class="nav-placeholder short"></div>
        <div class="profile-placeholder"></div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <div class="line large"></div>
          <div class="line medium"></div>
          <div class="line small"></div>
          <div class="hero-button"></div>
        </div>
        <div class="hero-art" aria-label="Hero image placeholder"></div>
      </section>

      <section class="category-strip" aria-label="Category placeholders">
        <div class="category active"><span></span><b></b></div>
        <div class="category"><span></span><b></b></div>
        <div class="category"><span></span><b></b></div>
        <div class="category"><span></span><b></b></div>
        <div class="category"><span></span><b></b></div>
        <div class="category"><span></span><b></b></div>
        <div class="category"><span></span><b></b></div>
        <div class="category"><span></span><b></b></div>
      </section>

      <section class="listing-section">
        <div class="section-heading">
          <div class="heading-lines">
            <div class="line heading"></div>
            <div class="line subheading"></div>
          </div>
          <div class="heading-control"></div>
        </div>
        <div class="listing-grid">
          <article class="listing-card">
            <div class="card-image"></div>
            <div class="card-details"><div class="line card-title"></div><div class="line card-meta"></div><div class="line card-price"></div></div>
          </article>
          <article class="listing-card">
            <div class="card-image"></div>
            <div class="card-details"><div class="line card-title"></div><div class="line card-meta"></div><div class="line card-price"></div></div>
          </article>
          <article class="listing-card">
            <div class="card-image"></div>
            <div class="card-details"><div class="line card-title"></div><div class="line card-meta"></div><div class="line card-price"></div></div>
          </article>
          <article class="listing-card">
            <div class="card-image"></div>
            <div class="card-details"><div class="line card-title"></div><div class="line card-meta"></div><div class="line card-price"></div></div>
          </article>
        </div>
      </section>

      <section class="feature-banner">
        <div class="feature-visual"></div>
        <div class="feature-copy">
          <div class="line heading"></div>
          <div class="line subheading"></div>
          <div class="feature-button"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-column"><div class="line footer-title"></div><div class="line footer-line"></div><div class="line footer-line"></div></div>
      <div class="footer-column"><div class="line footer-title"></div><div class="line footer-line"></div><div class="line footer-line"></div></div>
      <div class="footer-column"><div class="line footer-title"></div><div class="line footer-line"></div><div class="line footer-line"></div></div>
      <div class="footer-reference">
        <span>Grey-box structure study</span>
        <a href="https://www.airbnb.com/" target="_blank" rel="noreferrer">View original homepage</a>
      </div>
    </footer>
  </div>
</body>
</html>
